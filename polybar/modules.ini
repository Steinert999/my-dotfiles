;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; SPACERS / SEPARATORS
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/gap]
type = custom/text
content = " "
content-foreground = ${color.background}

[module/gap2]
type = custom/text
content = " | "
content-foreground = ${color.blue}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; WORKSPACES
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/workspaces]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/workspaces_separated.sh
tail = false
interval = 1
format = <label>
label = %output%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; TITLE
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/title]
type = internal/xwindow
format = <label>
format-foreground = ${color.foreground-alt}
label = "%title%"
label-maxlen = 40
label-empty = "Desktop"

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; VOL — plain text "VOL 45%" style
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/vol]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/volume.sh
interval = 2
format = <label>
format-foreground = ${color.green}
label = %output%
click-right = pavucontrol &
scroll-up   = /home/steinert/.xmonad/scripts/xmonad_volume --inc
scroll-down = /home/steinert/.xmonad/scripts/xmonad_volume --dec
click-left  = /home/steinert/.xmonad/scripts/xmonad_volume --toggle

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; UPTIME — plain text "UP: 1h 16m" style
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/uptime]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/uptime.sh
interval = 60
format = <label>
format-prefix = 
format-prefix-font = 3
format-foreground = ${color.foreground}
label = " %output%"

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; PLAYER — playerctl (MPD, Spotify, browser)
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/player]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/player_scroll.sh
interval = 2
format = <label>
format-foreground = ${color.foreground}
label = %output%
click-left  = playerctl play-pause &
click-right = playerctl next &

[module/playerctl]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/player_status.sh
interval = 2
format = <label>
format-foreground = ${color.blue}
label = %output%
click-left  = playerctl play-pause &
click-right = playerctl next &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; KERNEL — "KRN: 7.2.2-arch1-1" style
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/kernel]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/kernel.sh
interval = 3600
format = <label>
format-prefix = 
format-prefix-font = 3
format-foreground = ${color.blue}
label = " %output%"
click-left = ~/.xmonad/scripts/rofi_neofetch &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; WEATHER — tempo atual da regiao (via wttr.in)
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/weather]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/weather.sh
interval = 900
format = <label>
format-foreground = ${color.yellow}
label = " %output%"

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; NOTIFICATIONS — estado do dunst (nao perturbe / pendentes)
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/notifications]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/notifications.sh
interval = 5
format = <label>
format-foreground = ${color.purple}
label = " %output%"
label-font = 3
click-left = dunstctl set-paused toggle
click-right = ~/.xmonad/scripts/rofi_notifications
click-middle = dunstctl history-clear

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; DATE — "2026-09-01 01:09" style
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/datetime]
type = internal/date
interval = 1.0
time     = "%Y-%m-%d  %H:%M"
time-alt = "%A, %d %b %Y"
format = <label>
format-foreground = ${color.foreground}
; internal/date nao dispara click-left/click-right de forma confiavel, entao as
; acoes vao embutidas no label via areas de clique %{A} (A1=esq, A3=dir):
;   esquerdo -> alterna o formato (acao interna do modulo)
;   direito  -> abre o calcurse (calendario + lembretes) numa janela flutuante
label = %{A1:#datetime.toggle:}%{A3:/home/steinert/.xmonad/scripts/xmonad_calendar:}%time%%{A}%{A}

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; SHUTDOWN — clicável, abre rofi powermenu
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/shutdown]
type = custom/text
content = "⏻"
content-foreground = ${color.red}
content-padding = 1
click-left = ~/.xmonad/scripts/rofi_powermenu &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; BLUETOOTH — status e clique para menu
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/bluetooth]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/bluetooth_status.sh
interval = 5
format = <label>
format-prefix = 
format-prefix-font = 3
format-foreground = ${color.blue}
label = " %output%"
click-left = ~/.xmonad/scripts/rofi_bluetooth &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; AUDIO INPUT — fonte de áudio ativa
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/audioinput]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/audio_input.sh
interval = 5
format = <label>
format-prefix = 
format-prefix-font = 3
format-foreground = ${color.cyan}
label = " %output%"
click-left = ~/.xmonad/scripts/rofi_audioinput &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; BT BATTERY — bateria de dispositivos Bluetooth
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/bt-battery]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/bt_battery.sh
interval = 10
format = <label>
label = %output%

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_
;; STORAGE — uso total de armazenamento com clique para detalhes
;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/storage]
type = custom/script
exec = ~/.xmonad/theme/polybar/scripts/storage_total.sh
interval = 30
format = <label>
format-prefix = 󰆼
format-prefix-font = 3
format-foreground = ${color.purple}
label = " %output%"
click-left = ~/.config/xmonad/scripts/launch_rofi_disks
